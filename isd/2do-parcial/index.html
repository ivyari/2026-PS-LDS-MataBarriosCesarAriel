<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de subneteo</title>
</head>
<body>
    <header class="encabezado">
        <h1>Caclculadora de subneteo TPV4</h1>
        <p>Ejemplo de calculadora para subnetear redes en IPV4</p>
    </header>
    <nav class="pestanas" role="tablist">
        <button class="pestana activa" data-panel="panel-binario" role="tab">Decimal -- Binario</button>
        <button class="pestana" data-panel="panel-flsm" role="tab">DFLSM (subredes iguales)</button>
        <button class="pestana" data-panel="panel-vlsm" role="tab">VLSM (a la medida)</button>
        <button class="pestana" data-panel="panel-ip" role="tab">¿A que red pertenece?</button>
    </nav>

    <main>
        <section id="panel-binario" class="panel activo">
            <h2>COnertir un octeto o una IP a Binario</h2>
            <form id="bin-entrada" class="formulario">
                <label for="">Numero (0-255) o IP completa</label>
                <input type="text" id="bin-entrada" value="192.168.60.0" autocomplete="off">
                <button type="submit">Convertir</button>
            </form>
            <div id="bin-resultado"></div>
        </section>

        <section id="panel-flsm" class="panel">
            <h2>Dividir una red en subredes del mismo tamaño</h2>
            <form id="form-flsm" class="formulario">
                <label>Prefijo o mascara</label>
                <input type="text" id="flsm-prefijo" value="/8" autocomplete="off">
                <label>Red base</label>
                <input type="text" id="flsm-red" value="10.0.0.1" autocomplete="off">
                <label>Calcular por:
                    <select id="flsm-modo">
                        <option value="subredes">Numero de subredes</option>
                        <option value="hostPorSubred">Host por subred</option>
                    </select>
                </label>
                <label>Cantidad
                    <input type="number" min="1" value="16" id="flsm-cantidad">
                </label>
                <button type="submit">Subnetear</button>
            </form>
            <div id="flsm-resultado" ></div>
        </section>

        <section id="panel-vlsm" class="panel">
            <h2>Ajustar a cada area el bloque justo a lo que necesite</h2>
            <form id="form-vlsm" class="formulario">
                <label>Prefijo o mascara</label>
                <input type="text" id="flsm-prefijo" value="/24" autocomplete="off">
                <label>Red base</label>
                <input type="text" id="flsm-red" value="192.168.50.0" autocomplete="off">
                <div class="requerimientos">
                    <div class="req titulo">
                        <span>Area/subred</span><span>Hosts</span>
                    </div>
                    <div class="vlsm-filas">

                    </div>
                    <button type="button" id="vlsm-agregar" class="secundario">Agregar subred</button>

                </div>
                <button type="submit">Subnetear</button>
            </form>
            <div id="vlsm-resultado"></div>
        </section>

        <section id="panel-ip" class-panel>
            <h2>Encontrar la red, el rando y el broadcast de una IP</h2>
            <form id="form-ip" class="fromulario">
                <label>Direccion IP
                    <input type="text" id="ip-dir" value="10.28.90.92" autocomplete="off">
                </label>
                <label>Prefijo o Mascara
                    <input type="text" id="ip-prefijo" value="/12" a>
                </label>
                <button type="submit">Analizar</button>
            </form>
            <div id="ip-resultado"></div>
        </section>
    </main>
</body>
</html>
