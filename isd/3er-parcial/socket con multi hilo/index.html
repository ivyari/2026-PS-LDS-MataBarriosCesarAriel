<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones Ejemplo</title>
</head>
<body>
    <h1>Notificaciones Ejemplo</h1>
    <p>Estado: <span id="estado" class="desconectado">Desconectado</span></p>
    <p>Corre: <code>node servidor.js</code> y en su terminal veras el estado del servidor</p>
    <ul id="lista"></ul>
    <script>
        const estado = document.getElementById('estado');
        const lista = document.getElementById('lista');
        //necesitamos un socket con protocolo TCP
        //un websocket es un socket con protocolo TCP
        const socket = new WebSocket('ws://$(location.host)');

        socket.addEventListener('open', () => {
            estado.textContent = 'Conectado';
            estado.className = 'conectado';
        });

        socket.addEventListener('close', () => {
            estado.textContent = 'Desconectado';
            estado.className = 'desconectado';
        });

        socket.addEventListener('message', (event) => {
            const {tipo, mensaje, fecha} = JSON.parse(event.data);
            const item = document.createElement('li');
            item.innerHTML = `
            <time>${new Date(fecha).toLocaleTimeString()}</time> Tipo de estado [${tipo}] Mensaje: ${mensaje}
            `;
            lista.propend(item);
        });

    </script>
    
</body>
</html>
